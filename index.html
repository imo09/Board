:root{
  --carta:#F4ECE0; --inchiostro:#2B3036; --tenue:#5B636D; --bordo:rgba(43,48,54,.10);
  --ombra:0 1px 2px rgba(43,48,54,.10),0 6px 18px rgba(43,48,54,.10); --accento:#C96A2F;
  --marchio:"Poppins nautargo",system-ui,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--carta:#171C22; --inchiostro:#F4EFE8; --tenue:#9AA3AF; --bordo:rgba(255,255,255,.09);
    --ombra:0 1px 2px rgba(0,0,0,.30),0 6px 18px rgba(0,0,0,.25); --accento:#E8A867}
  .vela{filter:brightness(2.1)}
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--carta);color:var(--inchiostro)}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
  min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px)
          calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 16px);
  -webkit-tap-highlight-color:transparent}
.colonna{width:100%;max-width:520px;margin:0 auto;flex:1;display:flex;flex-direction:column}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px}
.nautargo{display:flex;align-items:center;gap:10px}
.nautargo svg{width:22px;height:34px;display:block;flex:none}
.marchio{font-family:var(--marchio);font-weight:600;font-size:23px;letter-spacing:-.01em;line-height:1}
.titolo{font-family:var(--marchio);font-weight:600;font-size:17px;letter-spacing:-.01em;line-height:1;white-space:nowrap}
.titolo span{color:var(--accento)}
main{padding-top:30px}
.app-griglia{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:22px 8px}
.app{display:flex;flex-direction:column;align-items:center;gap:9px;text-decoration:none;color:inherit;
  border-radius:18px;padding:4px 0;outline:none}
.app::after{content:"";width:5px;height:5px;margin-top:-3px;border-radius:50%}
.app.ultima::after{background:var(--accento)}
.ico{width:min(68px,100%);aspect-ratio:1;border-radius:23%;overflow:hidden;box-shadow:var(--ombra),0 0 0 1px var(--bordo);
  transition:transform .14s ease}
.ico svg,.ico img{width:100%;height:100%;display:block}
.nm{font-family:var(--marchio);font-weight:600;font-size:15px;line-height:1.1;letter-spacing:-.01em}
.app:active .ico{transform:scale(.93)}
.app:focus-visible .ico{box-shadow:0 0 0 3px var(--carta),0 0 0 5px var(--accento)}
@media (hover:hover){.app:hover .ico{transform:translateY(-2px)}}
.avviso{margin-top:34px;padding:14px 16px;border-radius:14px;box-shadow:0 0 0 1px var(--bordo);
  font-size:14px;color:var(--tenue);display:flex;gap:12px;align-items:flex-start}
.avviso[hidden]{display:none}
.avviso p{flex:1}
.avviso button{font:inherit;font-size:14px;font-weight:600;color:var(--inchiostro);background:none;border:0;
  padding:2px 0;cursor:pointer;white-space:nowrap}
footer{margin-top:auto;padding-top:40px;text-align:center;font-size:13px;color:var(--tenue)}
footer a{color:inherit;text-underline-offset:3px}
/* telefoni: la barra si stringe un poco perché [board] resti al centro senza toccare nautargo */
@media (max-width:409px){.marchio{font-size:21px} .nautargo{gap:9px} .nautargo svg{width:20px;height:31px} .titolo{font-size:16px}}
@media (max-width:374px){.marchio{font-size:18px} .nautargo{gap:7px} .nautargo svg{width:18px;height:28px} .titolo{font-size:15px}}
@media (max-width:339px){.marchio{font-size:17px} .nautargo{gap:6px} .nautargo svg{width:16px;height:25px} .titolo{font-size:14px}}
@media (max-width:319px){.app-griglia{grid-template-columns:repeat(3,1fr)}}
@media (min-width:700px){body{padding-top:48px} main{padding-top:44px} .ico{width:76px}}
</style>

<script>
(function () {
  function leggi(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function scrivi(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function app(nome) { return /^[a-z]+$/.test(nome || '') ? document.querySelector('.app[data-app="' + nome + '"]') : null; }

  // Scorciatoie dalla pressione lunga sull'icona: ?apri=folio porta subito a folio
  var scorciatoia = app(new URLSearchParams(location.search).get('apri'));
  if (scorciatoia) { scrivi('board.ultima', scorciatoia.dataset.app); location.replace(scorciatoia.href); return; }

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});

  // Lingua: italiano se il dispositivo e' in italiano, altrimenti inglese
  if (!/^it\b/i.test(navigator.language || 'it')) {
    document.documentElement.lang = 'en';
    document.querySelectorAll('[data-en]').forEach(function (n) { n.textContent = n.getAttribute('data-en'); });
  }

  // Ultima app aperta: un punto sotto il nome
  function segna(nome) {
    document.querySelectorAll('.app').forEach(function (a) { a.classList.toggle('ultima', a.dataset.app === nome); });
  }
  segna(leggi('board.ultima'));
  document.querySelector('.app-griglia').addEventListener('click', function (e) {
    var a = e.target.closest('.app');
    if (!a) return;
    scrivi('board.ultima', a.dataset.app);
    segna(a.dataset.app);
  });

  // Avviso su iPhone e iPad, finche' non si tocca "Ho capito"
  var ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  if (!ios || leggi('board.avvisoIos') === '1') return;
  var avviso = document.getElementById('avviso');
  avviso.hidden = false;
  document.getElementById('chiudiAvviso').onclick = function () {
    avviso.hidden = true;
    scrivi('board.avvisoIos', '1');
  };
})();
</script>
