:root{
  --carta:#F4ECE0; --foglio:#FBF7F1; --inchiostro:#2B3036; --su-inchiostro:#FBF7F1; --tenue:#5B636D;
  --bordo:rgba(43,48,54,.11); --bordo-forte:rgba(43,48,54,.24); --accento:#C96A2F;
  --ombra:0 1px 2px rgba(43,48,54,.10),0 6px 18px rgba(43,48,54,.10);
  --marchio:"Poppins nautargo",system-ui,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{--carta:#171C22; --foglio:#1F252C; --inchiostro:#F4EFE8; --su-inchiostro:#171C22; --tenue:#9AA3AF;
    --bordo:rgba(255,255,255,.09); --bordo-forte:rgba(255,255,255,.22); --accento:#E8A867;
    --ombra:0 1px 2px rgba(0,0,0,.30),0 6px 18px rgba(0,0,0,.25)}
  .vela{filter:brightness(2.1)}
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--carta);color:var(--inchiostro)}
body{font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;
  min-height:100dvh;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + 16px)
          calc(env(safe-area-inset-bottom) + 18px) calc(env(safe-area-inset-left) + 16px);
  -webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font:inherit;color:inherit}
.colonna{width:100%;max-width:520px;margin:0 auto;flex:1;display:flex;flex-direction:column}

/* barra: nautargo a sinistra, [board] al centro */
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px}
.nautargo{display:flex;align-items:center;gap:10px}
.nautargo svg{width:22px;height:34px;display:block;flex:none}
.marchio{font-family:var(--marchio);font-weight:600;font-size:23px;letter-spacing:-.01em;line-height:1}
.titolo{font-family:var(--marchio);font-weight:600;font-size:17px;letter-spacing:-.01em;line-height:1;white-space:nowrap}
.titolo span{color:var(--accento)}

/* sezioni */
.sezione{margin-top:26px}
.categoria{margin-top:22px}
.categoria:first-of-type{margin-top:14px}
.categoria .sez-titolo{margin-bottom:12px}
.sez-testa{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:32px;margin-bottom:14px}
.sez-titolo{font-family:var(--marchio);font-weight:600;font-size:15px;line-height:1;color:var(--tenue)}

/* avviso di nuova versione: striscia sotto la barra */
.avviso{display:flex;align-items:center;margin-top:12px;border-radius:12px;background:var(--foglio);box-shadow:0 0 0 1px var(--bordo)}
.avviso[hidden]{display:none}
.avviso-testo{flex:1;min-width:0;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 4px 0 14px;border:0;background:none;
  text-align:left;cursor:pointer;font-family:var(--marchio);font-weight:600;font-size:14px;line-height:1.25;color:var(--inchiostro);border-radius:12px}
.avviso-testo::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--accento)}
.avviso-chiudi{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--tenue);cursor:pointer;display:grid;place-items:center}
.avviso-chiudi svg{width:18px;height:18px}
.avviso button:focus-visible{outline:2px solid var(--accento);outline-offset:-2px}

/* interruttore "Al tocco": due posizioni scritte, Dettagli e Apri */
.interruttore{display:flex;align-items:center;justify-content:flex-end;gap:10px;margin-top:16px;font-size:13px;color:var(--tenue);user-select:none;-webkit-user-select:none}
.scelta{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;padding:2px;border-radius:99px;
  background:var(--bordo);box-shadow:inset 0 0 0 1px var(--bordo)}
.scelta input{position:absolute;inset:0;z-index:2;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.cursore{position:absolute;top:2px;bottom:2px;left:2px;width:calc(50% - 2px);border-radius:99px;background:var(--foglio);
  box-shadow:0 1px 2px rgba(0,0,0,.14),0 0 0 1px var(--bordo);transition:transform .2s}
.pos{position:relative;z-index:1;padding:5px 12px 6px;text-align:center;font-family:var(--marchio);font-weight:600;font-size:13px;line-height:1.2;
  color:var(--tenue);white-space:nowrap;transition:color .2s}
.scelta input:checked~.cursore{transform:translateX(100%)}
.scelta input:not(:checked)~.pos-dettagli,.scelta input:checked~.pos-apri{color:var(--inchiostro)}
.scelta input:focus-visible~.cursore{box-shadow:0 0 0 2px var(--accento)}

/* voci: app e skill */
.voce{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;outline:none}
.nm{font-family:var(--marchio);font-weight:600;font-size:15px;line-height:1.15;letter-spacing:-.01em}
.griglia{list-style:none;display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px}
.app{display:flex;flex-direction:column;align-items:center;gap:9px;text-decoration:none;border-radius:18px;padding:4px 0}
.app::after{content:"";width:5px;height:5px;margin-top:-3px;border-radius:50%}
.app.ultima::after{background:var(--accento)}
.app .ico{width:min(68px,100%);aspect-ratio:1;border-radius:23%;overflow:hidden;box-shadow:var(--ombra),0 0 0 1px var(--bordo);
  transition:transform .14s ease,box-shadow .14s ease}
.ico svg{width:100%;height:100%;display:block}
.app:active .ico{transform:scale(.93)}
.app[aria-expanded="true"] .ico,.app:focus-visible .ico{box-shadow:0 0 0 3px var(--carta),0 0 0 5px var(--accento)}
@media (hover:hover){.app:hover .ico{transform:translateY(-2px)}}

.elenco{list-style:none;display:grid;gap:10px}
.skill{width:100%;display:flex;align-items:center;gap:14px;padding:12px 14px 12px 12px;border:0;border-radius:16px;
  background:var(--foglio);box-shadow:0 0 0 1px var(--bordo);text-align:left;cursor:pointer;transition:box-shadow .14s ease}
.skill[aria-expanded="true"],.skill:focus-visible{box-shadow:0 0 0 2px var(--accento)}
.skill .ico{width:44px;height:44px;flex:none;border-radius:12px;display:grid;place-items:center;background:var(--carta)}
.skill .ico svg{width:24px;height:24px}
.skill .testo{min-width:0;display:grid;gap:3px}
.skill .riga{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;min-width:0}
.skill .nm{min-width:0;overflow-wrap:anywhere}
.sintesi{font-size:13.5px;line-height:1.4;color:var(--tenue);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tag{flex:none;font-family:var(--marchio);font-weight:600;font-size:11px;line-height:1;padding:3px 7px 4px;border-radius:99px;
  color:var(--accento);box-shadow:inset 0 0 0 1px currentColor}

footer{margin-top:auto;padding-top:40px;text-align:center;font-size:13px;color:var(--tenue)}
footer a{text-underline-offset:3px}

/* riquadro dei dettagli: dal basso sul telefono, di lato su schermi larghi */
.pannello{position:fixed;z-index:10;left:0;right:0;bottom:0;max-height:min(76dvh,640px);display:flex;flex-direction:column;
  background:var(--foglio);border-radius:22px 22px 0 0;box-shadow:0 -1px 0 var(--bordo),0 -12px 40px rgba(0,0,0,.16);
  padding-bottom:env(safe-area-inset-bottom);transform:translateY(105%);visibility:hidden;
  transition:transform .26s cubic-bezier(.3,.7,.2,1),visibility 0s .26s}
.pannello.aperto{transform:none;visibility:visible;transition:transform .26s cubic-bezier(.3,.7,.2,1)}
.pannello.lettura{height:calc(100dvh - env(safe-area-inset-top) - 18px);max-height:none}
.p-testa{display:flex;align-items:center;gap:12px;padding:16px 10px 12px 18px}
.p-ico{width:44px;height:44px;flex:none;border-radius:12px;overflow:hidden;display:grid;place-items:center;background:var(--carta)}
.p-ico svg{width:100%;height:100%;display:block}
.p-ico.skill-ico svg{width:24px;height:24px}
.p-titoli{min-width:0;flex:1}
.p-nome{font-family:var(--marchio);font-weight:600;font-size:20px;line-height:1.15;letter-spacing:-.01em;overflow-wrap:anywhere}
.p-sotto{display:flex;align-items:center;gap:8px;margin-top:3px;font-size:13px;color:var(--tenue)}
.p-chiudi,.p-condividi{flex:none;width:44px;height:44px;border:0;border-radius:50%;background:none;color:var(--tenue);cursor:pointer;display:grid;place-items:center}
.p-chiudi svg{width:22px;height:22px}
.p-condividi{margin-right:-6px}
.p-condividi svg{width:20px;height:20px}
.p-condividi.fatto{width:auto;padding:0 10px;border-radius:22px}
.p-condividi.fatto svg{display:none}
.p-esito{font-size:13px;font-weight:600;color:var(--accento)}
.p-chiudi:focus-visible,.p-condividi:focus-visible{outline:2px solid var(--accento)}
.p-corpo{flex:1;overflow:auto;overscroll-behavior:contain;padding:2px 20px 14px;font-size:15px;line-height:1.55}
.p-desc{font-size:16px}
.p-etichetta{margin:18px 0 6px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--tenue)}
.p-corpo ul{padding-left:20px}
.p-corpo li{margin:4px 0}
.p-nota{font-size:13px;color:var(--tenue);line-height:1.45}
.p-corpo .p-nota{margin-top:10px}
.p-azioni{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px 14px;border-top:1px solid var(--bordo)}
.p-azioni .p-nota{flex:1 1 100%;text-align:center}
.btn{flex:1;display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 14px;border:0;border-radius:13px;
  font-weight:600;font-size:15px;text-decoration:none;cursor:pointer;background:none;box-shadow:inset 0 0 0 1px var(--bordo-forte)}
.btn.primario{flex:1 1 100%;background:var(--inchiostro);color:var(--su-inchiostro);box-shadow:none}
.btn:focus-visible{outline:2px solid var(--accento);outline-offset:2px}

/* skill letta per intero */
.md{font-size:15px;line-height:1.6}
.md>*+*{margin-top:12px}
.md h3,.md h4,.md h5{font-family:var(--marchio);font-weight:600;line-height:1.25;letter-spacing:-.01em}
.md h3{font-size:20px}.md h4{font-size:16.5px;margin-top:22px}.md h5{font-size:15px;margin-top:18px}
.md ul,.md ol{padding-left:22px}
.md li+li{margin-top:5px}
.md code{font-family:var(--mono);font-size:.88em;padding:1px 5px;border-radius:5px;background:var(--carta)}
.md pre{padding:12px 14px;border-radius:10px;background:var(--carta);overflow:auto}
.md pre code{padding:0;background:none}
.md blockquote{padding-left:12px;border-left:3px solid var(--accento);color:var(--tenue)}
.md hr{border:0;border-top:1px solid var(--bordo)}
.md a{color:var(--accento)}
.md .tabella{overflow-x:auto}
.md table{border-collapse:collapse;font-size:14px;min-width:100%}
.md th,.md td{padding:7px 10px 7px 0;border-bottom:1px solid var(--bordo);text-align:left;vertical-align:top}
.md th{font-weight:600}

@media (max-width:759px){body.aperto main{padding-bottom:48vh}}
@media (min-width:760px){
  body{padding-top:48px;transition:padding-right .26s}
  body.aperto:not(.lettura){padding-right:416px}
  .app .ico{width:76px}
  .pannello{left:auto;top:0;width:400px;max-height:none;border-radius:0;transform:translateX(105%);
    box-shadow:-1px 0 0 var(--bordo),-12px 0 40px rgba(0,0,0,.12);padding-top:env(safe-area-inset-top)}
  .pannello.lettura{width:min(640px,100vw - 120px);height:auto}
  .p-testa{padding-top:22px}
}
/* telefoni: la barra si stringe perché [board] resti al centro senza toccare nautargo */
@media (max-width:409px){.marchio{font-size:21px} .nautargo{gap:9px} .nautargo svg{width:20px;height:31px} .titolo{font-size:16px}}
@media (max-width:374px){.marchio{font-size:18px} .nautargo{gap:7px} .nautargo svg{width:18px;height:28px} .titolo{font-size:15px}
  .interruttore{font-size:12px;gap:8px} .pos{padding:5px 10px 6px;font-size:12.5px}}
@media (max-width:339px){.marchio{font-size:17px} .nautargo{gap:6px} .nautargo svg{width:16px;height:25px} .titolo{font-size:14px}
  .griglia{grid-template-columns:repeat(3,1fr)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="colonna">

<header>
  <div class="nautargo">
    <svg viewBox="300 85 220 335" aria-hidden="true">
      <g class="vela">
        <path d="M475.937 98.7457L452.965 215.21L351.835 240.434Z" fill="#2B3840"/>
        <path d="M452.945 215.214L351.845 240.423L408.472 267.511Z" fill="#263039"/>
        <path d="M351.84 240.421L407.127 266.797L335.389 347.492Z" fill="#2F3A40"/>
        <path d="M438.972 261.011L452.957 215.21L491.352 298.816Z" fill="#2D3A42"/>
        <path d="M335.397 347.455L377.479 344.597L459.711 301.475L438.972 261.011Z" fill="#242F37"/>
        <path d="M335.386 347.489L438.972 261.011L452.961 215.198Z" fill="#3F484F"/>
        <path d="M459.695 301.468L491.357 298.844L438.98 261.015Z" fill="#3F484E"/>
      </g>
      <path d="M311.404 363.14L392.687 408.599L381.125 357.818Z" fill="#CB763F"/>
      <path d="M392.678 408.589L418.308 408.507L503.519 311.874L463.239 314.994L381.119 357.813Z" fill="#D07C49"/>
      <path d="M507.958 359.386L503.521 311.871L418.301 408.507Z" fill="#C06A37"/>
    </svg>
    <div class="marchio">nautargo</div>
  </div>
  <h1 class="titolo"><span>[</span>board<span>]</span></h1>
</header>

<div class="avviso" id="avviso" role="status" hidden>
  <button class="avviso-testo" type="button" data-en="Updated. Tap to reload.">Aggiornata. Tocca per ricaricare.</button>
  <button class="avviso-chiudi" type="button" aria-label="Chiudi avviso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>

<main>

<!-- Interruttore "Al tocco": Dettagli (predefinito) o Apri. Vale per le app; le skill aprono sempre i dettagli. -->
<div class="interruttore">
  <span data-en="On tap">Al tocco</span>
  <span class="scelta">
    <input type="checkbox" id="rapido" role="switch">
    <span class="cursore" aria-hidden="true"></span>
    <span class="pos pos-dettagli" aria-hidden="true" data-en="Details">Dettagli</span>
    <span class="pos pos-apri" aria-hidden="true" data-en="Open">Apri</span>
  </span>
</div>

<!-- ============ APP ============
     Una <section class="categoria"> per categoria, nell'ordine in cui compaiono: titolo nell'<h2> (data-en = testo inglese).
     Una categoria senza app non si scrive. Per aggiungere un'app copia un blocco <li> dentro la categoria giusta:
     data-id (nome breve, solo lettere minuscole), indirizzo, icona, nome e, nel <template class="info">,
     la descrizione e i punti di "Come funziona" (data-en = testo inglese). -->
<section class="sezione categoria">
  <h2 class="sez-titolo" data-en="Travel">Viaggi</h2>
  <ul class="griglia">

    <li><a class="voce app" data-id="sero" href="https://sero.nautargo.com/" aria-controls="pannello" aria-expanded="false">
      <span class="ico"><svg viewBox="4 4 64 64" aria-hidden="true" fill="none">
        <rect x="4" y="4" width="64" height="64" fill="#2B3036"/>
        <rect x="16" y="20" width="40" height="38" rx="9" stroke="#ECE1D1" stroke-width="4"/>
        <path d="M26 20V12h20v8" stroke="#ECE1D1" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M28 40l7 7 12-14" stroke="#DD7A3B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg></span>
      <span class="nm">sero</span></a>
      <template class="info">
        <p class="p-desc" data-en="It tells you if your luggage fits, before you leave.">Ti dice se il bagaglio ci sta, prima di partire.</p>
        <ul>
          <li data-en="Pick the kind of trip and start from a ready-made list.">Scegli il tipo di viaggio e parti da una lista pronta.</li>
          <li data-en="Add items by category: the bars show your bag's volume and weight.">Aggiungi gli oggetti per categoria: le barre mostrano volume e peso della valigia.</li>
          <li data-en="Tick what you have packed and save the list for the next trip.">Spunta cosa hai già messo dentro e salva la lista per il prossimo viaggio.</li>
        </ul>
      </template>
    </li>

  </ul>
</section>

<section class="sezione categoria">
  <h2 class="sez-titolo" data-en="Money and home">Soldi e casa</h2>
  <ul class="griglia">

    <li><a class="voce app" data-id="sestante" href="https://sestante.nautargo.com/" aria-controls="pannello" aria-expanded="false">
      <span class="ico"><svg viewBox="4 4 64 64" aria-hidden="true">
        <defs><clipPath id="sestanteTaglio"><rect x="4" y="4" width="64" height="64"/></clipPath></defs>
        <rect x="4" y="4" width="64" height="64" fill="#0E1D2A"/>
        <circle cx="46" cy="27" r="11" fill="#E8A867" opacity=".2"/>
        <circle cx="46" cy="27" r="4.5" fill="#E8A867"/>
        <g clip-path="url(#sestanteTaglio)"><path d="M-4 54 C 18 42, 46 42, 76 52 L76 80 L-4 80 Z" fill="#E9EDEC"/></g>
      </svg></span>
      <span class="nm">sestante</span></a>
      <template class="info">
        <p class="p-desc" data-en="Personal finances with envelopes and goals, with no bank link and no cloud.">Le finanze personali con buste e traguardi, senza banca collegata né cloud.</p>
        <ul>
          <li data-en="All income flows into the Riserva, your reserve.">Tutte le entrate arrivano nella Riserva.</li>
          <li data-en="Fondi are spending envelopes that refill on their own; Stelle are goals with an amount and a date.">I Fondi sono buste per le spese che si ricaricano da sole; le Stelle sono traguardi con una cifra e una data.</li>
          <li data-en="With the Punto you check your figures against reality now and then.">Con il Punto confronti ogni tanto i conti con la realtà.</li>
        </ul>
      </template>
    </li>

    <li><a class="voce app" data-id="lare" href="https://lare.nautargo.com/" aria-controls="pannello" aria-expanded="false">
      <span class="ico"><svg viewBox="4 4 64 64" aria-hidden="true" fill="none">
        <rect x="4" y="4" width="64" height="64" fill="#1F3B52"/>
        <path d="M17 54H55" stroke="#919FA9" stroke-width="4" stroke-linecap="round"/>
        <path d="M24 54V36a12 12 0 0 1 24 0V54" stroke="#EEF2F1" stroke-width="4" stroke-linecap="round"/>
        <circle cx="36" cy="39.94" r="6.5" fill="#E8A867"/>
      </svg></span>
      <span class="nm">lare</span></a>
      <template class="info">
        <p class="p-desc" data-en="What the home you want really costs, with every figure in plain sight.">Quanto costa davvero la casa che vuoi, con tutti i conti in chiaro.</p>
        <ul>
          <li data-en="Enter price and down payment: lare works out the mortgage.">Inserisci prezzo e anticipo: lare calcola il mutuo.</li>
          <li data-en="It adds the one-off costs, such as taxes and notary, and the furniture, with basic or premium templates.">Somma le spese una tantum, come tasse e notaio, e gli arredi, con modelli essenziale o premium.</li>
          <li data-en="It also shows the costs of every month.">Mostra anche le spese di ogni mese.</li>
        </ul>
      </template>
    </li>

  </ul>
</section>

<section class="sezione categoria">
  <h2 class="sez-titolo" data-en="Notes and reading">Note e letture</h2>
  <ul class="griglia">

    <li><a class="voce app" data-id="folio" href="https://folio.nautargo.com/" aria-controls="pannello" aria-expanded="false">
      <span class="ico"><svg viewBox="4 4 64 64" aria-hidden="true">
        <rect x="4" y="4" width="64" height="64" fill="#2A2621"/>
        <g fill="none" stroke="#F6F0E3" stroke-linecap="round" stroke-linejoin="round">
          <path stroke-width="5.5" d="M33.06 52V31a7.5 7.5 0 0 1 7.5-7.5h2.2"/>
          <path stroke-width="4.75" d="M33.06 34.6h5.8"/>
        </g>
        <circle cx="42.8" cy="51.9" r="2.7" fill="#8F5F22"/>
      </svg></span>
      <span class="nm">folio</span></a>
      <template class="info">
        <p class="p-desc" data-en="Markdown notes, organised in notebooks, groups and pages, that stay on your device.">Note in Markdown, ordinate in quaderni, gruppi e fogli, che restano sul tuo dispositivo.</p>
        <ul>
          <li data-en="You write in a visual editor that saves clean .md files.">Scrivi in un editor visuale che salva file .md puliti.</li>
          <li data-en="Favourites, search and a bin you can restore from.">Preferiti, ricerca e cestino con ripristino.</li>
          <li data-en="Backup as .json or as a .zip of .md files.">Backup in .json o come .zip di file .md.</li>
        </ul>
      </template>
    </li>

    <li><a class="voce app" data-id="teca" href="https://teca.nautargo.com/" aria-controls="pannello" aria-expanded="false">

 1957.0 -133.5Q1991.0 -153 2011.0 -189.5Q2031.0 -226 2031.0 -277Q2031.0 -328 2011.0 -364.5Q1991.0 -401 1957.0 -420.5Q1923.0 -440 1884.0 -440Z" fill="#E9EDEC"/></g></svg></span>
      <span class="nm">teca</span></a>
      <template class="info">
        <p class="p-desc" data-en="Opens pages, books, comics, tables and code, safely on your device.">Apre pagine, libri, fumetti, tabelle e codice, al sicuro sul tuo dispositivo.</p>
        <ul>
          <li data-en="Reads HTML, Markdown, text, images, EPUB, FB2, CBZ, CSV, JSON, XML and code.">Legge HTML, Markdown, testo, immagini, EPUB, FB2, CBZ, CSV, JSON, XML e codice.</li>
          <li data-en="One file per tab; books and comics resume from the last page you saw.">Un file per scheda; libri e fumetti riprendono dall'ultima pagina vista.</li>
          <li data-en="Scripts in HTML pages stay off until you turn them on.">Gli script delle pagine HTML restano spenti finché non li accendi.</li>
        </ul>
      </template>
    </li>

  </ul>
</section>

<!-- ============ SKILL ============
     Un blocco <li> per skill: data-id, data-md (il file .md nella cartella skill), nome e sintesi.
     data-esempio segna le skill di esempio; toglilo dalle skill vere. -->
<section class="sezione" aria-labelledby="titoloSkill">
  <div class="sez-testa">
    <h2 class="sez-titolo" id="titoloSkill">skill</h2>
  </div>
  <ul class="elenco">

    <li><button class="voce skill" type="button" data-id="pubblica-webapp" data-md="pubblica-webapp.md" data-esempio aria-controls="pannello" aria-expanded="false">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h7l4 4v13h-11z"/><path d="M13.5 3.5v4h4"/><path d="M9.5 12.5h5M9.5 16h5" style="stroke:var(--accento)"/></svg></span>
      <span class="testo">
        <span class="riga"><span class="nm">pubblica-webapp</span><span class="tag" data-en="example">esempio</span></span>
        <span class="sintesi" data-en="Puts a new nautargo app online on its own subdomain, with GitHub Pages and Aruba DNS.">Mette online una nuova app nautargo sul suo sottodominio, con GitHub Pages e il DNS di Aruba.</span>
      </span>
    </button></li>

    <li><button class="voce skill" type="button" data-id="voce-nautargo" data-md="voce-nautargo.md" data-esempio aria-controls="pannello" aria-expanded="false">
      <span class="ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h7l4 4v13h-11z"/><path d="M13.5 3.5v4h4"/><path d="M9.5 12.5h5M9.5 16h5" style="stroke:var(--accento)"/></svg></span>
      <span class="testo">
        <span class="riga"><span class="nm">voce-nautargo</span><span class="tag" data-en="example">esempio</span></span>
        <span class="sintesi" data-en="Writes copy in the nautargo voice: few things, said clearly.">Scrive testi con il tono di nautargo: poche cose, dette con chiarezza.</span>
      </span>
    </button></li>

  </ul>
